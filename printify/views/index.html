<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printify</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f3f4f6; color: #111827; }
    .card { background: #fff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); text-align: center; max-width: 360px; }
    h1 { margin: 0 0 0.5rem; }
    p { color: #4b5563; }
    button { margin-top: 1rem; padding: 0.75rem 1.5rem; font-size: 1rem; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Printify</h1>
    <p>Connect your Pixi account to load pictures for printing.</p>
    <form method="post" action="/connect">
      <button type="submit">Connect to Pixi</button>
    </form>
  </main>
</body>
</html>
